[project]
name = "reflex-agent"
version = "0.1.0"
description = "Reflex — A Fast, Resilient Hybrid Browser Agent (System 1 Jev/Turnike + System 2 Supervisor)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
turnike = ["torch>=2.11", "transformers>=5.17", "torchao>=0.18", "accelerate"]
mcp = ["mcp>=1.9,<2"]

[project.scripts]
reflex = "reflex.server:main"
reflex-mcp = "reflex.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflex"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
